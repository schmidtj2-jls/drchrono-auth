<!DOCTYPE html>
<html>
<head>
  <title>Signing in...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 60px 24px;
           background: #0D132B; color: #F7F7F8; }
    h2 { font-size: 22px; margin-bottom: 12px; }
    p  { color: #C7CAD1; margin-bottom: 40px; font-size: 15px; }
    .btn { display: inline-block; padding: 18px 36px; background: #4FA8A6; color: white;
           text-decoration: none; border-radius: 14px; font-size: 18px; font-weight: 600;
           letter-spacing: 0.3px; }
    .btn:active { opacity: 0.8; }
    .note { margin-top: 28px; font-size: 13px; color: #7A8BA6; }
  </style>
</head>
<body>
  <h2>Sign-in complete</h2>
  <p>Tap below to return to Chronoscope.</p>
  <a id="btn" class="btn" href="">Return to Chronoscope</a>
  <p class="note">If the app does not open, make sure Expo Go is installed.</p>
  <script>
    var params = window.location.search;
    var intentUrl = 'intent://192.168.50.191:8081/--/auth' + params +
                    '#Intent;scheme=exp;package=host.exp.exponent;end';
    document.getElementById('btn').href = intentUrl;
    setTimeout(function() { window.location = intentUrl; }, 400);
  </script>
</body>
</html>
