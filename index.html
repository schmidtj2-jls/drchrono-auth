<!DOCTYPE html>
<html>
<head>
  <title>Signing in...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 60px 24px;
           background: #0D132B; color: #F7F7F8; }
    h2 { font-size: 22px; margin-bottom: 12px; }
    p  { color: #C7CAD1; margin-bottom: 28px; font-size: 15px; line-height: 1.5; }
    .btn { display: inline-block; padding: 16px 32px; background: #4FA8A6; color: white;
           text-decoration: none; border-radius: 14px; font-size: 17px; font-weight: 600;
           letter-spacing: 0.3px; }
    .btn:active { opacity: 0.8; }
    .note { margin-top: 28px; font-size: 13px; color: #7A8BA6; }
  </style>
</head>
<body>
  <h2>Sign-in complete</h2>
  <p>Returning to Chronoscope...</p>
  <a id="btn" class="btn" href="">Return to Chronoscope</a>
  <p class="note">If Chronoscope is installed, it should open automatically.</p>
  <script>
    // With Android App Links configured, Chronoscope intercepts this URL before
    // the page ever renders. This script + button is the fallback path for cases
    // where verification failed (older Android, sideloaded debug build) or the
    // user opens this URL in a desktop browser.
    var params = window.location.search;
    var fallback = 'intent://auth' + params +
                   '#Intent;scheme=drchronoschedule;package=com.drchronoschedule.app;end';
    document.getElementById('btn').href = fallback;
    setTimeout(function() { window.location = fallback; }, 600);
  </script>
</body>
</html>
